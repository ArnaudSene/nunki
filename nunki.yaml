# nunki, as a project it orchestrates itself (SPEC 4.1).
#
# Written by hand for now: `nunki init` does not exist yet. This file is here so
# the tool is exercised on itself — the first project it orchestrates should
# be the one whose rules it enforces.

harness: claude-code

# No agent may reach the forge: a slot's origin is unreachable, and an
# allowlist naming the forge would undo that (SPEC 3.1, 4.1 bis rule 6).
forge:
  - github.com

stacks:
  - rust

protected_branches:
  - main
  - dev

# Public since 2026-09-11, so GitHub's free plan protects both branches: a
# pull request is required, and so are the CI's checks. The forge holds the
# rule and `nunki check` asks it (SPEC 4.1 bis). It was `by_hand` while the
# repository was private, when the forge could neither protect a branch nor
# say whether one was (403, measured 2026-09-10).
forge_protection: forge

protected_paths:
  # The gate, the sidecar and the rules of the place are not an agent's to
  # rewrite while it is being gated by them.
  refuse:
    # The battery gate 6 replays, the allowlist the firewall is built from
    # and the image the agent runs in. Weakening any of the three would let a
    # run pass a gate it should not.
    - .nunki/**
    - .github/workflows/**
    - assets/firewall/**
    - AGENTS.md
    - CLAUDE.md
    - deny.toml
  refuse_if_exists:
    - Cargo.lock
    - SPEC.md
