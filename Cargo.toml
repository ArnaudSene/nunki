[package]
name = "hq"
version = "0.1.0"
edition = "2024"
description = "Mission orchestrator for AI coding agents — stack- and harness-agnostic"
license = "Apache-2.0"
rust-version = "1.85"

[lib]
name = "hq"
path = "src/lib.rs"

[[bin]]
name = "hq"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
