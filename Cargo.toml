[package]
name = "nunki"
version = "0.1.0"
edition = "2024"
description = "Mission orchestrator for AI coding agents — stack- and harness-agnostic"
license = "Apache-2.0"
rust-version = "1.85"

[lib]
name = "nunki"
path = "src/lib.rs"

[[bin]]
name = "nunki"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
serde_yaml_ng = "0.10"
clap = { version = "4.6.6", features = ["derive"] }
tempfile = "3"
globset = "0.4.19"
ureq = { version = "3.4.1", default-features = false, features = ["rustls"] }

[dev-dependencies]
serde_yaml_ng = "0.10"
tempfile = "3"
