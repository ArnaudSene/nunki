# Every YAML file nunki reads goes through `nunki::yaml::from_str`, whose
# settings are not the library's defaults (a merge key is an ordinary key, an
# unknown tag is refused, only `true` and `false` are booleans, a duplicate
# key is an error). A call to any other reader would read with the defaults,
# so each one is refused here, in the code and in the tests alike.
disallowed-methods = [
    { path = "serde_saphyr::from_str", reason = "read YAML with nunki::yaml::from_str" },
    { path = "serde_saphyr::from_str_with_options", reason = "read YAML with nunki::yaml::from_str" },
    { path = "serde_saphyr::from_slice", reason = "read YAML with nunki::yaml::from_str" },
    { path = "serde_saphyr::from_slice_with_options", reason = "read YAML with nunki::yaml::from_str" },
    { path = "serde_saphyr::from_reader", reason = "read YAML with nunki::yaml::from_str" },
    { path = "serde_saphyr::from_reader_with_options", reason = "read YAML with nunki::yaml::from_str" },
    { path = "serde_saphyr::from_multiple", reason = "read YAML with nunki::yaml::from_str" },
    { path = "serde_saphyr::from_multiple_with_options", reason = "read YAML with nunki::yaml::from_str" },
    { path = "serde_saphyr::from_slice_multiple", reason = "read YAML with nunki::yaml::from_str" },
    { path = "serde_saphyr::from_slice_multiple_with_options", reason = "read YAML with nunki::yaml::from_str" },
    { path = "serde_saphyr::read", reason = "read YAML with nunki::yaml::from_str" },
    { path = "serde_saphyr::read_with_options", reason = "read YAML with nunki::yaml::from_str" },
    { path = "serde_saphyr::with_deserializer_from_str", reason = "read YAML with nunki::yaml::from_str" },
    { path = "serde_saphyr::with_deserializer_from_str_with_options", reason = "read YAML with nunki::yaml::from_str" },
    { path = "serde_saphyr::with_deserializer_from_slice", reason = "read YAML with nunki::yaml::from_str" },
    { path = "serde_saphyr::with_deserializer_from_slice_with_options", reason = "read YAML with nunki::yaml::from_str" },
    { path = "serde_saphyr::with_deserializer_from_reader", reason = "read YAML with nunki::yaml::from_str" },
    { path = "serde_saphyr::with_deserializer_from_reader_with_options", reason = "read YAML with nunki::yaml::from_str" },
]
# The parser's own event stream, which reads YAML without any of the settings.
disallowed-types = [
    { path = "serde_saphyr::granit_parser::Parser", reason = "read YAML with nunki::yaml::from_str" },
]
